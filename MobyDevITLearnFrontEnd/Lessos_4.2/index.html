<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Podcast Landing Page</title>
	<link rel="stylesheet" href="styles.css">
	<style>
	@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap');
	</style>
</head>

<body>

	<header>
		<nav>
			<div class="logo">
				<img src="logo.svg" alt="Logo Castaway">

			</div>
			<ul class="menu">
				<li><a href="#">Home</a></li>
				<li><a href="#">Episodes</a></li>
				<li><a href="#">About</a></li>
				<li><a href="#">Contact</a></li>
			</ul>
		</nav>
	</header>

	<section class="hero">
		<div class="image">
			<img src="Frame.svg" alt="main image">
		</div>
		<div class="content">
			<h2>Take your <br>podcast to the <span>next <b>level</b></span></h2>
			<img src="next.svg" alt="next-under" class="next-under">
			<p>Listen on</p>
			<div class="platforms">
				<img class="icons" src="social-media.svg" alt="musical platforms">
			</div>
		</div>

	</section>

	<section> 
		<div class="page-2">
			<h2>Latest episodes</h2>
			<button class="all-episodes">View all episodes</button>
		</div>

		<di class="gear">
			<div class="gear-layout">
			<img src="Gear.svg" alt="gear">

			<div class="gear-gray">Gear</div>
				<p>Episode 3</p>
				<h2>should you Get</h2>
			</div>
		</div>
	</section>

</body>

</html>
